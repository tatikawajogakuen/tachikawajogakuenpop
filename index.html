<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>表示結果プレビュー</title>

  <style>
    body {
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,0.25), transparent 45%),
        linear-gradient(180deg, #ffe15a 0%, #ffe8ef 55%, #fff4c2 100%);
      font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ===== 背景アイテム ===== */
    .bg-item {
      position: absolute;
      font-size: 72px;
      opacity: 0.22;
      pointer-events: none;
    }

    .depth-small { transform: scale(1.2); }
    .depth-large { transform: scale(1.6); }

    .item-pencil { left: 46%; top: 30%; transform: rotate(-12deg); }
    .item-book   { left: 55%; top: 42%; transform: rotate(8deg); }
    .item-bag    { left: 32%; top: 58%; transform: rotate(-6deg); }
    .item-note   { left: 64%; top: 66%; transform: rotate(10deg); }
    .item-ruler  { left: 15%; top: 18%; transform: rotate(6deg); }
    .item-chalk  { left: 82%; top: 20%; transform: rotate(-8deg); }
    .item-desk   { left: 12%; top: 78%; transform: rotate(4deg); }
    .item-pen    { left: 88%; top: 60%; transform: rotate(-10deg); }

    /* ===== メインBOX ===== */
    .handwritten-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      padding: 6.6em 1em 1.2em;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.82));
      border: 6px solid #ffffff;
      border-radius: 36px;
      box-shadow:
        0 14px 0 #ffd6e6,
        0 22px 36px rgba(255, 140, 180, 0.45);
      backdrop-filter: blur(4px);
      max-height: 85vh;
      overflow-y: auto;
    }

    /* タイトル（安定版） */
    .title-wrap{
      position: static;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25em;
      margin-bottom: 0.6em;
    }

    .box-title {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.55em 1.4em;
      background: radial-gradient(circle at top, #ffb3d1, #e84f8a);
      border-radius: 999px;
      box-shadow: 0 8px 0 #ffd6e6, 0 14px 24px rgba(232,79,138,0.4);
      font-weight: 900;
      color: #ffffff;
      font-family: "Comic Sans MS","Hiragino Maru Gothic Pro","Yu Gothic",cursive;
      transform: rotate(-2deg);
      max-width: calc(100% - 1em);
      box-sizing: border-box;
      white-space: nowrap;
    }

    .line-horizontal {
      font-size: 2.1em;
      letter-spacing: 0.12em;
    }

    .star{
      font-size: 0.9em;
      line-height: 1;
    }

    /* 見出し */
    .pop-headline {
      background: linear-gradient(180deg, #fff0f6, #ffe3ef);
      display: inline-block;
      padding: 0.45em 0.8em;
      border-radius: 1em;
      margin-top: 0.7em;
      margin-bottom: 0.5em;
      color: #d6336c;
      font-size: 1.8em;
      font-weight: 900;
      letter-spacing: 0.08em;
      font-family: "Comic Sans MS","Hiragino Maru Gothic Pro","Yu Gothic",cursive;
      box-shadow:
        0 6px 0 #ffd6e6,
        0 10px 20px rgba(255, 140, 180, 0.35);
    }

    .intro-block {
      background:#fff7cc;
      display:inline-block;
      padding:0.5em 0.8em;
      border-radius:0.8em;
      margin:0.4em 0;
      color:#8b2f4c;
      font-weight:900;
      font-size:1.1em;
      font-family:'Comic Sans MS','Hiragino Maru Gothic Pro','Yu Gothic',cursive;
      line-height:1.25;
    }

    p {
      color:#6b2c44;
      font-size:1.05em;
      line-height:1.45;
      margin:0.3em 0;
    }

    .section-title {
      font-size: 1.25em;
      font-weight: 900;
      margin-top: 0.6em;
      margin-bottom: 0.2em;
    }

    .room-images{
      display:flex;
      flex-direction: column;
      gap: 0.6em;
      margin: 0.4em 0 0.6em;
    }
    .room-images img{
      width:100%;
      height:auto;
      border-radius:0.6em;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    @media screen and (max-width:600px){
      .line-horizontal{font-size:2em;}
      .pop-headline{font-size:1.5em;}
    }

    .viewport-guide {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      height: 100vh;
      border: 2px dashed rgba(255,0,0,0.6);
      pointer-events: none;
      z-index: 9999;
    }
      .school-image{
      width:90%;
      max-width:390px; /* 1.5倍 */
    }
    .school-image img{
      width:100%;
      height:auto;
      display:block;
      transform: scale(1.5);
      transform-origin: top center;
    }

    .preview-tabs{
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.6em;
      z-index: 10000;
    }
    .preview-tabs button{
      padding: 0.5em 0.9em;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .preview-tabs button.active{
      background: #ff7fb0;
      color: #fff;
    }

</style>
</head>

<body>

  <div class="preview-tabs">
    <button id="tab-normal" class="active">通常表示</button>
    <button id="tab-preview">スマホプレビュー</button>
  </div>

  <div class="viewport-guide"></div>

  <!-- 背景 -->
  <div class="bg-item depth-large item-pencil">⭐✏️</div>
  <div class="bg-item depth-small item-book">📘</div>
  <div class="bg-item depth-large item-bag">🎒</div>
  <div class="bg-item depth-small item-note">📒</div>
  <div class="bg-item depth-small item-ruler">📏</div>
  <div class="bg-item depth-large item-chalk">🧽</div>
  <div class="bg-item depth-small item-desk">🪑</div>
  <div class="bg-item depth-large item-pen">🖊️</div>

  <div class="handwritten-box">

    <div class="title-wrap">

    <div class="school-image">
      <img src="立川女学園ロゴ.png" alt="立川女学園ロゴ">
    </div>

    <div class="box-title">
      <span class="line-horizontal">キャスト募集中</span>
        </div>

    </div>

    <h2 class="pop-headline">
      立川女学園の<br>待機室を紹介！
    </h2>

    <div class="intro-block">
      初めまして！<br>
      スタッフのはるきちです！<br>
      今回は待機室を<br>
      大公開しちゃいます！！
    </div>

    <p class="section-title">① お部屋全体の雰囲気</p>
    <p>朝・夜の毎日</p>
    <p>綺麗好きのスタッフが</p>
    <p>隅々まで清掃しております！</p>
    <p>昨年待機室を</p>
    <p>リニューアルしましたので、</p>
    <p>ピカピカの待機室で働いて頂けます！</p>

    <p class="section-title">② 各個室の紹介</p>
    <div class="room-images">
      <img src="待機室①加工済み.png" alt="個室①">
      <img src="待機室②加工済み.png" alt="個室②">
      <img src="待機室③加工済み.png" alt="個室③">
      <img src="待機室④加工済み.png" alt="個室④">
    </div>

    <p class="section-title">③ 安心ポイント</p>
    <p>全室個室待機制！！</p>
    <p>ウォーターサーバー あり〇</p>
    <p>冷蔵庫 あり〇</p>
    <p>喫煙所 あり〇</p>

  </div>

  <script>
    const guide = document.querySelector('.viewport-guide');
    const tabNormal = document.getElementById('tab-normal');
    const tabPreview = document.getElementById('tab-preview');

    tabPreview.onclick = () => {
      guide.style.display = 'none';
      tabPreview.classList.add('active');
      tabNormal.classList.remove('active');
    };

    tabNormal.onclick = () => {
      guide.style.display = 'block';
      tabNormal.classList.add('active');
      tabPreview.classList.remove('active');
    };
  </script>

</body>
</html>
